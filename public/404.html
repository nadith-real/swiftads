<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA deep-link fallback for static hosts (GitHub Pages, S3, Netlify 404).
      // The requested path is carried to the app via ?p= and the router restores it.
      var path =
        window.location.pathname + window.location.search + window.location.hash;
      var target = path && path !== "/" ? "/?p=" + encodeURIComponent(path) : "/";
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
