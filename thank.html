<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Swift Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .thankyou-box {
      background: #fff;
      border-radius: 12px;
      padding: 60px 40px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    p {
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #555;
    }
    a {
      display: inline-block;
      padding: 14px 28px;
      background: #0073e6;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>
  <div class="thankyou-box">
    <h1>Thank You!</h1>
    <p>Your details have been submitted successfully.<br>
       A Growth Engineer from Swift Digital will reach out within 1 business day.</p>
    <a href="https://www.swiftdigital.online/">Return to Homepage</a>
  </div>
</body>
</html>
