<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Digital — Web Design & Digital Agency in Sri Lanka</title>
    <meta
      name="description"
      content="Colombo-based digital agency for web design, SEO, marketing, e-commerce & software. Fair pricing, fast delivery, English/Sinhala/Tamil."
    />
    <meta name="theme-color" content="#080b10" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swift Digital" />
    <meta property="og:image" content="https://swiftdigital.online/images/swift-dark-hero.webp" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080b10'/%3E%3Cpath d='M33 9H51L34 27H49L18 55L30 33H12L33 9Z' fill='%23f4f6fa'/%3E%3Cpath d='M33 9H51L34 27H25L33 9Z' fill='%236494ff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;800&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/images/swift-dark-hero.webp" as="image" type="image/webp" fetchpriority="high" />
    <style>
      .swift-call-button {
        position: fixed;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 21px;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        background: #6494ff;
        color: #080b10;
        box-shadow: 0 10px 32px rgba(0,0,0,.32), 0 0 24px rgba(100,148,255,.22);
        font: 700 14px/1 Inter, sans-serif;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .swift-call-button:hover {
        transform: translateY(-3px);
        background: #82aaff;
        box-shadow: 0 14px 38px rgba(0,0,0,.38), 0 0 30px rgba(100,148,255,.3);
      }
      .swift-call-button:focus-visible {
        outline: 3px solid #f4f6fa;
        outline-offset: 4px;
      }
      .swift-call-button svg { width: 19px; height: 19px; flex: 0 0 auto; }
      @media (max-width: 480px) {
        .swift-call-button {
          right: max(16px, env(safe-area-inset-right));
          bottom: max(16px, env(safe-area-inset-bottom));
          min-height: 50px;
          padding: 0 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .swift-call-button { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="swift-call-button" href="tel:+94776915799" aria-label="Call Swift Digital at +94 77 691 5799">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7.2 3.5h2.4l1.2 4.1-1.7 1.7a15.2 15.2 0 0 0 5.6 5.6l1.7-1.7 4.1 1.2v2.4c0 1.1-.9 2-2 2C10.2 18.8 5.2 13.8 5.2 7.5c0-1.1.9-2 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Call us</span>
    </a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
